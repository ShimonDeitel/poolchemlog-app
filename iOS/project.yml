name: PoolChemLog
options:
  bundleIdPrefix: com.shimondeitel.poolchemlog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  PoolChemLog:
    type: application
    platform: iOS
    sources:
      - path: PoolChemLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.poolchemlog
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: PoolChemLog/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  PoolChemLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PoolChemLogTests
      - path: PoolChemLog.storekit
    dependencies:
      - target: PoolChemLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.poolchemlog.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  PoolChemLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PoolChemLogUITests
    dependencies:
      - target: PoolChemLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.poolchemlog.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  PoolChemLog:
    build:
      targets:
        PoolChemLog: all
        PoolChemLogTests: [test]
        PoolChemLogUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: PoolChemLog.storekit
    test:
      config: Debug
      storeKitConfiguration: PoolChemLog.storekit
      targets:
        - PoolChemLogTests
        - PoolChemLogUITests
    archive:
      config: Release
